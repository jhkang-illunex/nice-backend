## RAG 토폴로지 (server2 단일)
##
## ┌─ server2 (RAG) ─────────────────────────────────────────────────────────┐
## │  rag-server   : HSCode RAG REST API (FastAPI, OpenAI-호환 LLM/Embed 호출) │
## │  redis        : 캐시                                                       │
## │  ingestion    : 잡 컨테이너 (hscode/hsk_embed 파이프라인, oneshot)         │
## │  llm  (옵션)  : 자체 LLM (ollama / vLLM)                                   │
## │  embed (옵션) : 자체 임베딩 (TEI)                                          │
## └────────────────────────────────────────────────────────────────────────┘
##
## PostgreSQL 은 원격 NICE 운영 인스턴스(172.30.1.101) 를 사용 — compose 에서 제외.
## graph-analysis / neo4j 는 본 RAG 운영에 불요 — 별도 인프라/형상에서 운영 (nice_graph
## 패키지 코드는 보존, 미래에 별도 compose 또는 인스턴스로 재추가 가능).
##
## profiles
##   server2                   : rag-server + redis (RAG 코어)
##   ingest                    : ingestion 잡 (적재/임베딩)
##   llm-local / embed-local   : 자체 LLM / 임베딩 컨테이너 (OpenAI-호환)
##
## 기동 패턴
##   dev (전체 띄움):
##     docker compose --profile server2 --profile llm-local --profile embed-local up -d --build
##
##   실배포 (CPU):
##     docker compose --profile server2 --profile llm-local --profile embed-local up -d --build
##
##   실배포 (GPU, vLLM):
##     docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
##         --profile server2 --profile llm-local --profile embed-local up -d --build
##
##   외부 LLM/Embed API 사용 (llm-local/embed-local 안 띄움):
##     docker compose --profile server2 up -d --build
##     # 단 .env 의 LLM_BASE_URL / EMBED_BASE_URL 을 외부 URL 로 설정
##
##   ingestion 잡:
##     docker compose --profile ingest run --rm ingestion \
##         python -m nice_ingest run hscode --file=/work/hsk.xlsx
##     docker compose --profile ingest run --rm ingestion \
##         python -m nice_ingest run hsk_embed --batch-size 32
##
## LLM/Embed 백엔드 전환 = .env 의 LLM_BASE_URL / EMBED_BASE_URL 1줄 변경.
## (자체 호스팅 ↔ 외부 OpenAI/Anthropic proxy 모두 동일 OpenAI-호환 REST)

services:
  redis:
    profiles: ["server2"]
    image: redis:7-alpine
    container_name: nice-redis
    command:
      - redis-server
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [nice-net]

  rag-server:
    profiles: ["server2"]
    build:
      context: .
      dockerfile: deploy/rag-server/Dockerfile
    image: nice/rag-server:${APP_TAG:-dev}
    container_name: nice-rag-server
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # PG 는 원격(NICE 운영). 컨테이너 → 호스트 외부로 직접 도달.
      POSTGRES_HOST: ${POSTGRES_HOST:-172.30.1.101}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-nice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nice}
      POSTGRES_DB: ${POSTGRES_DB:-nice_innovation}
      REDIS_HOST: ${REDIS_HOST_INTERNAL:-redis}
      REDIS_PORT: ${REDIS_PORT_INTERNAL:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      # OpenAI-호환 백엔드 URL — 자체 호스팅 / 외부 API 모두 동일 인터페이스
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-noop}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://embed:8080/v1}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_API_KEY: ${EMBED_API_KEY:-noop}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_NORMALIZE: ${EMBED_NORMALIZE:-true}
      EMBED_QUERY_INSTRUCTION: ${EMBED_QUERY_INSTRUCTION:-}
    ports:
      - "${RAG_API_PORT:-18002}:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [nice-net]

  ingestion:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: deploy/ingestion/Dockerfile
    image: nice/ingestion:${APP_TAG:-dev}
    container_name: nice-ingestion
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # PG 는 원격(NICE 운영). 적재 대상 = rag.hsk 한정.
      POSTGRES_HOST: ${POSTGRES_HOST:-172.30.1.101}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-nice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nice}
      POSTGRES_DB: ${POSTGRES_DB:-nice_innovation}
      # 임베딩 백엔드 — hsk_embed 파이프라인이 사용
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://embed:8080/v1}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_API_KEY: ${EMBED_API_KEY:-noop}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_NORMALIZE: ${EMBED_NORMALIZE:-true}
      EMBED_QUERY_INSTRUCTION: ${EMBED_QUERY_INSTRUCTION:-}
    volumes:
      - ./:/work:ro
    working_dir: /work
    restart: "no"
    networks: [nice-net]

  # ─────────────────────────────────────────────────────────────────────────────
  # 자체 LLM / 임베딩 — 옵션 (profile 로 토글). 외부 API 로 전환 시엔
  # 이 두 서비스를 띄우지 않고 LLM_BASE_URL / EMBED_BASE_URL 만 갈아끼움.
  # ─────────────────────────────────────────────────────────────────────────────
  llm:
    profiles: ["llm-local"]
    # dev 기본 = ollama (CPU 로컬 추론 가능, 소형 모델).
    # prod GPU 에서는 docker-compose.gpu.yml 이 이 서비스를 vLLM 으로 교체한다
    # (image / command / ipc / GPU 자원 override). base 의 LLM_BASE_URL 포트
    # (11434) 가 유지되도록 vLLM 도 --port 11434 로 listen — rag-server 코드 무수정.
    image: ollama/ollama:latest
    container_name: nice-llm
    ports:
      - "${LLM_PORT:-11434}:11434"
    volumes:
      - llm-models:/root/.ollama
    restart: unless-stopped
    networks: [nice-net]

  embed:
    profiles: ["embed-local"]
    # TEI CPU — BAAI/bge-m3 (XLM-R 기반 다국어 retrieval). 0.6B 정도 크기로 CPU
    # 에서도 PoC 운영 가능. GPU 가속이 필요해지면 docker-compose.gpu.yml 의 주석
    # 블록을 활성(image GPU 태그 + GPU 자원 reservation) 하면 됨.
    # 차원: 1024 (모델 출력 그대로). 다른 모델로 swap 시 EMBED_MODEL 한 줄 변경.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: nice-embed
    command:
      - "--model-id"
      - "${EMBED_MODEL:-BAAI/bge-m3}"
      - "--port"
      - "8080"
      - "--max-batch-tokens"
      - "16384"
    ports:
      - "${EMBED_PORT:-18080}:8080"
    volumes:
      - embed-models:/data
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      HF_HOME: /data
    restart: unless-stopped
    networks: [nice-net]

volumes:
  redis-data:
  llm-models:
  embed-models:

networks:
  nice-net:
    driver: bridge
