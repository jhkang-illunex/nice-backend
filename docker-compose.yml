## NICE PoC 백엔드 토폴로지 — RAG + Network 두 개 독립 컨테이너
##
## ┌─ rag ────────────────────────────────────────────────────────────────────┐
## │  rag-server   : HSCode RAG REST API (FastAPI, OpenAI-호환 LLM/Embed 호출) │
## │  redis        : RAG 캐시                                                   │
## │  ingestion    : hscode/hsk_embed 잡 컨테이너                              │
## │  llm  (옵션)  : 자체 LLM (ollama / vLLM)                                   │
## │  embed (옵션) : 자체 임베딩 (TEI)                                          │
## └────────────────────────────────────────────────────────────────────────┘
##
## ┌─ network (graph-analysis) ──────────────────────────────────────────────┐
## │  graph-analysis : public.node/edge → networkx → 네트워크 분석 REST API    │
## └────────────────────────────────────────────────────────────────────────┘
##
## 두 서비스 모두 원격 PG (172.30.1.101:5433/nice_innovation) 사용 — read-only.
## RAG = rag.hsk schema, Network = public.node/edge. 격리 보장.
##
## profiles
##   rag                       : rag-server + redis
##   network                   : graph-analysis
##   ingest                    : ingestion 잡 (적재/임베딩)
##   llm-local / embed-local   : 자체 LLM / 임베딩 컨테이너 (옵션)
##
## 기동 패턴
##   RAG + Network 둘 다 + 자체 LLM/Embed:
##     docker compose --profile rag --profile network \
##                    --profile llm-local --profile embed-local up -d --build
##
##   RAG 만:
##     docker compose --profile rag --profile llm-local --profile embed-local up -d --build
##
##   Network 만:
##     docker compose --profile network up -d --build
##
##   외부 LLM/Embed API (자체 컨테이너 안 띄움):
##     docker compose --profile rag --profile network up -d --build
##     # .env 의 LLM_BASE_URL / EMBED_BASE_URL 을 외부 URL 로 설정
##
##   GPU prod (vLLM):
##     docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
##         --profile rag --profile network --profile llm-local --profile embed-local up -d --build
##
##   ingestion 잡:
##     docker compose --profile ingest run --rm ingestion \
##         python -m nice_ingest run hscode --file=/work/hsk.xlsx
##     docker compose --profile ingest run --rm ingestion \
##         python -m nice_ingest run hsk_embed --batch-size 32

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # RAG layer
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    profiles: ["rag"]
    image: redis:7-alpine
    container_name: nice-redis
    command:
      - redis-server
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [nice-net]

  rag-server:
    profiles: ["rag"]
    build:
      context: .
      dockerfile: deploy/rag-server/Dockerfile
    image: nice/rag-server:${APP_TAG:-dev}
    container_name: nice-rag-server
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 원격 NICE 운영 PG
      POSTGRES_HOST: ${POSTGRES_HOST:-172.30.1.101}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-nice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nice}
      POSTGRES_DB: ${POSTGRES_DB:-nice_innovation}
      REDIS_HOST: ${REDIS_HOST_INTERNAL:-redis}
      REDIS_PORT: ${REDIS_PORT_INTERNAL:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-noop}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      # qwen3 류 thinking 모델 제어 ('none'=추론 끔). 빈 값이면 body 미포함.
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      # 문장형 질의 → LLM 품목 추출 전처리 (키워드 질의는 미호출, 실패 시 폴백)
      RAG_QUERY_EXTRACT: ${RAG_QUERY_EXTRACT:-true}
      RAG_EXTRACT_TIMEOUT_S: ${RAG_EXTRACT_TIMEOUT_S:-15}
      # /agent CRAG 1회 보정 (unrelated 즉시 거부 / ambiguous 재검색·병합)
      RAG_CRAG: ${RAG_CRAG:-true}
      # /search CRAG — 저신뢰(top1<임계)일 때만 평가, unrelated 는 빈 리스트
      RAG_CRAG_SEARCH: ${RAG_CRAG_SEARCH:-true}
      # /search CRAG 발동 임계 — lowconf(0.033)와 분리. 2시그널 경계 정답
      # (LNG 0.0328)이 거부되지 않도록 1시그널 잡음 구간만 평가 대상으로.
      RAG_CRAG_SEARCH_THRESHOLD: ${RAG_CRAG_SEARCH_THRESHOLD:-0.025}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://embed:8080/v1}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_API_KEY: ${EMBED_API_KEY:-noop}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_NORMALIZE: ${EMBED_NORMALIZE:-true}
      EMBED_QUERY_INSTRUCTION: ${EMBED_QUERY_INSTRUCTION:-}
    ports:
      - "${RAG_API_PORT:-18002}:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [nice-net]

  # ─────────────────────────────────────────────────────────────────────────────
  # shock-server — 순수 쇼크 전파 API (triple_list 입력, DB·LLM·Redis 의존 없음).
  #   외부 노출 엔드포인트: POST /api/shock/tariff, POST /api/shock/volume, GET /health.
  #   stateless — depends_on 없음, 수평확장 자유. RAG 와 독립 배포.
  # ─────────────────────────────────────────────────────────────────────────────
  shock-server:
    profiles: ["shock"]
    build:
      context: .
      dockerfile: deploy/shock-server/Dockerfile
    image: nice/shock-server:${APP_TAG:-dev}
    container_name: nice-shock-server
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${SHOCK_API_PORT:-18004}:8000"
    restart: unless-stopped
    networks: [nice-net]

  # ─────────────────────────────────────────────────────────────────────────────
  # Neo4j — 현재 미사용(비활성). 보존용 주석 (나중에 필요 시 해제).
  #
  # 현역 shock 파이프라인(nice_graph)·데모(app_shock)·RAG 는 그래프 노드/엣지를
  # 전부 PostgreSQL 에서 읽으므로 Neo4j 가 필요 없다. Neo4j 를 참조하는 코드는
  # 레거시 적재 계층(nice_poc.etl.sinks.neo4j / nice_poc.result dual-write /
  # nice_ingest)뿐이며 현재 어떤 실행 서비스에도 포함되지 않는다.
  # 향후 dual-write ETL 을 가동할 때만 아래 service 블록 + volumes 주석을 해제할 것.
  # (원본: 커밋 7ba0279^ 의 neo4j 서비스 정의)
  #
  # neo4j:
  #   profiles: ["server1"]
  #   image: neo4j:5.24-community
  #   container_name: nice-neo4j
  #   environment:
  #     NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nice-poc-2026}
  #     NEO4J_PLUGINS: '["apoc"]'
  #     NEO4J_server_memory_heap_initial__size: 2G
  #     NEO4J_server_memory_heap_max__size: 4G
  #     NEO4J_server_memory_pagecache_size: 8G
  #     NEO4J_dbms_security_procedures_unrestricted: apoc.*
  #     NEO4J_dbms_security_procedures_allowlist: apoc.*
  #     NEO4J_apoc_export_file_enabled: "true"
  #     NEO4J_apoc_import_file_enabled: "true"
  #     NEO4J_apoc_import_file_use__neo4j__config: "true"
  #   ports:
  #     - "${NEO4J_HTTP_PORT:-7474}:7474"
  #     - "${NEO4J_BOLT_PORT:-7687}:7687"
  #   volumes:
  #     - neo4j-data:/data
  #     - neo4j-logs:/logs
  #     - neo4j-import:/import
  #     - neo4j-plugins:/plugins
  #   healthcheck:
  #     test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10
  #   restart: unless-stopped
  #   networks: [nice-net]

  # ─────────────────────────────────────────────────────────────────────────────
  # Network layer (graph-analysis)
  #
  # public.node / public.edge → networkx 분석. PG read-only, Neo4j 미사용.
  # nice_poc.propagation / matrix 통합은 별 단계.
  # ─────────────────────────────────────────────────────────────────────────────
  graph-analysis:
    profiles: ["network"]
    build:
      context: .
      dockerfile: deploy/graph-analysis/Dockerfile
    image: nice/graph-analysis:${APP_TAG:-dev}
    container_name: nice-graph-analysis
    command: ["uvicorn", "nice_graph.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 원격 NICE 운영 PG — read-only 사용
      POSTGRES_HOST: ${POSTGRES_HOST:-172.30.1.101}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-nice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nice}
      POSTGRES_DB: ${POSTGRES_DB:-nice_innovation}
      # /api/shock/extract_first_target 의 LLM 호출용 (OpenAI-호환).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-noop}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
    ports:
      - "${GRAPH_API_PORT:-18001}:8000"
    restart: unless-stopped
    networks: [nice-net]

  # ─────────────────────────────────────────────────────────────────────────────
  # Demo layer (Streamlit) — HS → s_ra604 시드 → edge 3차 확장 → LLM → 쇼크 산출
  #
  # rag-server / graph-analysis 를 HTTP 로 호출하고 (compose network DNS),
  # kis_ra.s_ra604 + public.node/edge 는 운영 PG 에 read-only SELECT 로 직접 접근.
  # profile demo 로 토글.
  # ─────────────────────────────────────────────────────────────────────────────
  demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: deploy/demo/Dockerfile
    image: nice/demo:${APP_TAG:-dev}
    container_name: nice-demo
    # 신규 파이프라인 앱(app_shock.py)으로 entrypoint override — Dockerfile CMD(레거시 app.py)는 보존.
    command:
      - streamlit
      - run
      - src/nice_demo/app_shock.py
      - --server.port=8000
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 마운트된 소스(./src)를 site-packages 보다 우선시켜 호스트 수정이 즉시 반영되게.
      PYTHONPATH: /app/src
      POSTGRES_HOST: ${POSTGRES_HOST:-172.30.1.101}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-nice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nice}
      POSTGRES_DB: ${POSTGRES_DB:-nice_innovation}
      RAG_API_URL: ${RAG_API_URL_INTERNAL:-http://rag-server:8000}
      GRAPH_API_URL: ${GRAPH_API_URL_INTERNAL:-http://graph-analysis:8000}
      # 전파를 shock 서버(HTTP)에 위임 — compose 내부 DNS
      SHOCK_API_URL: ${SHOCK_API_URL_INTERNAL:-http://shock-server:8000}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-noop}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
    # 소스 핫리로드 — 호스트 ./src 를 컨테이너 /app/src 에 바인드. PYTHONPATH 와 함께
    # 이미지 재빌드 없이 코드 수정이 반영된다(streamlit 재시작/자동 rerun 시).
    volumes:
      - ./src:/app/src
    ports:
      - "${DEMO_API_PORT:-18003}:8000"
    restart: unless-stopped
    networks: [nice-net]

  # ─────────────────────────────────────────────────────────────────────────────
  # Ingestion (RAG 적재 잡)
  # ─────────────────────────────────────────────────────────────────────────────
  ingestion:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: deploy/ingestion/Dockerfile
    image: nice/ingestion:${APP_TAG:-dev}
    container_name: nice-ingestion
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: ${POSTGRES_HOST:-172.30.1.101}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-nice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nice}
      POSTGRES_DB: ${POSTGRES_DB:-nice_innovation}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://embed:8080/v1}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_API_KEY: ${EMBED_API_KEY:-noop}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_NORMALIZE: ${EMBED_NORMALIZE:-true}
      EMBED_QUERY_INSTRUCTION: ${EMBED_QUERY_INSTRUCTION:-}
    volumes:
      - ./:/work:ro
    working_dir: /work
    restart: "no"
    networks: [nice-net]

  # ─────────────────────────────────────────────────────────────────────────────
  # 자체 LLM / 임베딩 — 옵션 (profile 로 토글). 외부 API 로 전환 시엔
  # 이 두 서비스를 띄우지 않고 LLM_BASE_URL / EMBED_BASE_URL 만 갈아끼움.
  # ─────────────────────────────────────────────────────────────────────────────
  llm:
    profiles: ["llm-local"]
    # dev 기본 = ollama (CPU 로컬 추론 가능, 소형 모델).
    # prod GPU 에서는 docker-compose.gpu.yml 이 vLLM 으로 image 교체.
    image: ollama/ollama:latest
    container_name: nice-llm
    ports:
      - "${LLM_PORT:-11434}:11434"
    volumes:
      - llm-models:/root/.ollama
    restart: unless-stopped
    networks: [nice-net]

  embed:
    profiles: ["embed-local"]
    # TEI CPU — BAAI/bge-m3 (XLM-R 기반 다국어 retrieval, 1024-d).
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: nice-embed
    command:
      - "--model-id"
      - "${EMBED_MODEL:-BAAI/bge-m3}"
      - "--port"
      - "8080"
      - "--max-batch-tokens"
      - "16384"
    ports:
      - "${EMBED_PORT:-18080}:8080"
    volumes:
      - embed-models:/data
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      HF_HOME: /data
    restart: unless-stopped
    networks: [nice-net]

volumes:
  redis-data:
  llm-models:
  embed-models:
  # Neo4j 비활성 — 위 neo4j 서비스 주석과 함께 해제 (보존용)
  # neo4j-data:
  # neo4j-logs:
  # neo4j-import:
  # neo4j-plugins:

networks:
  nice-net:
    driver: bridge
