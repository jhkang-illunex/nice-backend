[project]
name = "nice-poc"
version = "0.1.0"
description = "NICE openinnovation PoC — 공급망/수요망 충격 시뮬레이션 백엔드"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "illunex" }]

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Storage drivers
    "neo4j>=5.24",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # HTTP — OpenAI-호환 백엔드 호출
    "httpx>=0.27",

    # Numerics
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "networkx>=3.3",
]

[project.optional-dependencies]
# rag-server 전용 — 지금은 base 외 추가분 없음(임베딩은 원격 base_url 사용).
# 자체 임베딩 로딩이 필요해지면 search 를 여기 추가.
rag = []
# ingestion 잡 컨테이너 — Excel 파서
ingest = [
    "openpyxl>=3.1",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]
search = [
    # rag-server 가 임베딩 모델을 자체 로딩할 때만. base_url 패턴이면 불요.
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
# Streamlit 데모 (HS 검색 → 시드 → 3차 확장 → LLM 1차 선정 → 쇼크 산출)
demo = [
    "streamlit>=1.41",
    "streamlit-agraph>=0.0.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/nice_poc",
    "src/nice_common",
    "src/nice_graph",
    "src/nice_rag",
    "src/nice_ingest",
    "src/nice_demo",
    "src/nice_llm",
    "src/nice_shock",
    "src/nice_dbtool",
    "src/nice_migrate",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
