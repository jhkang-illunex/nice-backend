[project]
name = "nice-poc"
version = "0.1.0"
description = "NICE openinnovation PoC — 공급망/수요망 충격 시뮬레이션 백엔드"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "illunex" }]

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Storage drivers
    "neo4j>=5.24",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.1",

    # Numerics
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "networkx>=3.3",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]
search = [
    # 운영 1.1 진입 시 활성화. torch 는 환경에 맞춰 별도 설치 권장.
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nice_poc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
